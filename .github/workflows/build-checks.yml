name: Budgetism source and portable build checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-server-test:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/server_package_guards.py
      - run: dotnet run --project tests/plaid-contract/plaid-contract.csproj --configuration Release
      - name: Retrieve pinned official PostgreSQL binaries
        run: |
          New-Item -ItemType Directory build | Out-Null
          Invoke-WebRequest 'https://sbp.enterprisedb.com/getfile.jsp?fileid=1260609' -OutFile build/postgresql.zip
          if ((Get-FileHash build/postgresql.zip -Algorithm SHA256).Hash -ne 'E2246BA91D22345BC3D017586C09EDE52D9DF180B1EEB480F050445F1CAD84E2') { throw 'PostgreSQL archive hash mismatch.' }
          Expand-Archive build/postgresql.zip build/postgresql
      - name: Build and exercise isolated server package
        run: |
          ./scripts/test_server_bank.ps1 -DotnetPath (Get-Command dotnet).Source -PostgresDirectory "$PWD/build/postgresql/pgsql"
          ./scripts/package_server_test.ps1 -DotnetPath (Get-Command dotnet).Source -PostgresDirectory "$PWD/build/postgresql/pgsql" -OutputDirectory "$PWD/build/server-kit"
          powershell.exe -NoProfile -File ./build/server-kit/Test-BudgetismServer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive only manifested files
        run: python scripts/archive_server_test.py build/server-kit build/Budgetism-Windows-Server-Test.zip
      - name: Test permanent services on ephemeral Windows runner
        run: |
          $env:PGPASSWORD = 'fictional-wrong-ambient-value'
          powershell.exe -NoProfile -File ./build/server-kit/Install-BudgetismServer.ps1 -InstallDirectory "$PWD/build/private-service"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('BudgetismApi','BudgetismDatabase')) {
            $service = Get-CimInstance Win32_Service -Filter "Name='$name'"
            if ($service.StartName -ne "NT SERVICE\$name" -or $service.State -ne 'Running' -or $service.StartMode -ne 'Auto') { throw 'Service identity/state mismatch.' }
          }
          $listeners = @(Get-NetTCPConnection -State Listen | Where-Object { $_.LocalPort -in @(55080,55432) })
          if ($listeners.Count -ne 2 -or @($listeners | Where-Object LocalAddress -ne '127.0.0.1').Count -ne 0) { throw 'Unexpected server listener.' }
          powershell.exe -NoProfile -File ./build/server-kit/Install-BudgetismServer.ps1 -InstallDirectory "$PWD/build/private-service" 2> build/repeat-error.txt
          if ($LASTEXITCODE -eq 0 -or (Get-Content build/repeat-error.txt -Raw) -notmatch 'already exists') { throw 'Repeated install was not safely rejected.' }
          $global:LASTEXITCODE = 0
          Stop-Service BudgetismApi
          Stop-Service BudgetismDatabase
      - name: Initialize Defender on ephemeral runner
        run: powershell.exe -NoProfile -File ./scripts/prepare_ci_defender.ps1 -ReportDirectory build/security
      - name: Scan exact server archive and extracted files
        run: ./scripts/scan_windows_package.ps1 -Archive "$PWD/build/Budgetism-Windows-Server-Test.zip" -ReportDirectory "$PWD/build/server-scan"
      - uses: actions/upload-artifact@v4
        with:
          name: Budgetism-Windows-Server-Test
          path: build/Budgetism-Windows-Server-Test.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Budgetism-server-test-scan
          path: build/server-scan/*.json

  source-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_layout.py --self-test
      - run: python scripts/check_layout.py
      - run: python scripts/verify_windows_package.py --self-test

  backend-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build services/api/Budgetism.Api.csproj --configuration Release
      - run: dotnet run --project tests/ledger-contract/ledger-contract.csproj --configuration Release
      - run: dotnet run --project tests/plaid-contract/plaid-contract.csproj --configuration Release

  updater-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - working-directory: tools/updater
        run: go test -race ./...
      - run: mkdir -p build/tools
      - working-directory: tools/updater
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags='-H windowsgui' -o ../../build/tools/Budgetism-Updater.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Budgetism-updater-test-binary
          path: build/tools/Budgetism-Updater.exe
          if-no-files-found: error

  flutter-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
      - working-directory: apps/client
        run: |
          flutter create --platforms=web --project-name budgetism --no-pub .
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --dart-define=APP_VERSION=0.1.0-dev.23

  windows-portable:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract clean source archive without Git metadata
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'Budgetism-source'
          $archive = Join-Path $env:RUNNER_TEMP 'Budgetism-source.zip'
          git archive --format=zip --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $archive -DestinationPath $source
          if (Test-Path (Join-Path $source '.git')) { throw 'Archive contains Git metadata.' }
          "BUDGETISM_SOURCE=$source" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate archive source layout and negative control
        working-directory: ${{ env.BUDGETISM_SOURCE }}
        run: |
          python scripts/check_layout.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_layout.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Initialize Defender on the ephemeral build machine
        timeout-minutes: 3
        working-directory: ${{ env.BUDGETISM_SOURCE }}
        run: powershell -NoProfile -File ./scripts/prepare_ci_defender.ps1 -ReportDirectory build/security
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test updater from extracted source
        working-directory: ${{ env.BUDGETISM_SOURCE }}/tools/updater
        run: go test ./...
      - name: Build updater helper
        working-directory: ${{ env.BUDGETISM_SOURCE }}/tools/updater
        run: |
          New-Item ../../build/tools -ItemType Directory -Force | Out-Null
          go build -ldflags='-H windowsgui' -o ../../build/tools/Budgetism-Updater.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate Windows project
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter create --platforms=windows --project-name budgetism --no-pub .
      - name: Resolve Flutter packages
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter pub get
      - name: Analyze Flutter client
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter analyze
      - name: Test Flutter client and encrypted storage
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test
      - name: Test native OS key storage - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/device_restart_test.dart -d windows --dart-define=SECURITY_TEST_PHASE=write --dart-define="SECURITY_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-security-restart"
      - name: Test native custom appearance - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/appearance_restart_test.dart -d windows --dart-define=APPEARANCE_TEST_PHASE=write --dart-define="APPEARANCE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-appearance-restart"
      - name: Test native read-only private server dashboard
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/server_dashboard_native_test.dart -d windows
      - name: Test native custom appearance - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/appearance_restart_test.dart -d windows --dart-define=APPEARANCE_TEST_PHASE=read --dart-define="APPEARANCE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-appearance-restart"
      - name: Test native review filters and batch decisions
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/review_batch_native_test.dart -d windows
      - name: Test native saved server address - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/server_address_restart_test.dart -d windows --dart-define=SERVER_ADDRESS_TEST_PHASE=write --dart-define="SERVER_ADDRESS_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-address-restart"
      - name: Test native saved server address - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/server_address_restart_test.dart -d windows --dart-define=SERVER_ADDRESS_TEST_PHASE=read --dart-define="SERVER_ADDRESS_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-address-restart"
      - name: Test native OS key storage - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/device_restart_test.dart -d windows --dart-define=SECURITY_TEST_PHASE=read --dart-define="SECURITY_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-security-restart"
      - name: Test native schedules - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/schedule_restart_test.dart -d windows --dart-define=SCHEDULE_TEST_PHASE=write --dart-define="SCHEDULE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-schedule-restart"
      - name: Test native schedules - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/schedule_restart_test.dart -d windows --dart-define=SCHEDULE_TEST_PHASE=read --dart-define="SCHEDULE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-schedule-restart"
      - name: Test native read-only calendar and forecast
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/planning_native_test.dart -d windows
      - name: Test native CSV imports - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/import_restart_test.dart -d windows --dart-define=IMPORT_TEST_PHASE=write --dart-define="IMPORT_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-import-restart"
      - name: Test native CSV imports - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/import_restart_test.dart -d windows --dart-define=IMPORT_TEST_PHASE=read --dart-define="IMPORT_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-import-restart"
      - name: Test native matching - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/matching_restart_test.dart -d windows --dart-define=MATCH_TEST_PHASE=write --dart-define="MATCH_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-matching-restart"
      - name: Test native matching - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/matching_restart_test.dart -d windows --dart-define=MATCH_TEST_PHASE=read --dart-define="MATCH_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-matching-restart"
      - name: Test native reconciliation - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/reconciliation_restart_test.dart -d windows --dart-define=RECONCILE_TEST_PHASE=write --dart-define="RECONCILE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-reconciliation-restart"
      - name: Test native reconciliation - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/reconciliation_restart_test.dart -d windows --dart-define=RECONCILE_TEST_PHASE=read --dart-define="RECONCILE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-reconciliation-restart"
      - name: Test native read-only financial reports and CSV export
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/reports_native_test.dart -d windows
      - name: Test native categorization rules - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/category_rules_restart_test.dart -d windows --dart-define=RULE_TEST_PHASE=write --dart-define="RULE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-rules-restart"
      - name: Test native categorization rules - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/category_rules_restart_test.dart -d windows --dart-define=RULE_TEST_PHASE=read --dart-define="RULE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-rules-restart"
      - name: Test native read-only register and protected record details
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/register_native_test.dart -d windows
      - name: Test native category undo - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/category_undo_restart_test.dart -d windows --dart-define=UNDO_TEST_PHASE=write --dart-define="UNDO_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-undo-restart"
      - name: Test native category undo - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/category_undo_restart_test.dart -d windows --dart-define=UNDO_TEST_PHASE=read --dart-define="UNDO_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-undo-restart"
      - name: Test native import profiles - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/import_profiles_restart_test.dart -d windows --dart-define=PROFILE_TEST_PHASE=write --dart-define="PROFILE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-profiles-restart"
      - name: Test native import profiles - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/import_profiles_restart_test.dart -d windows --dart-define=PROFILE_TEST_PHASE=read --dart-define="PROFILE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-profiles-restart"
      - name: Test native CSV rule suggestions - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/csv_rules_restart_test.dart -d windows --dart-define=CSV_RULE_TEST_PHASE=write --dart-define="CSV_RULE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-csv-rules-restart"
      - name: Test native CSV rule suggestions - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/csv_rules_restart_test.dart -d windows --dart-define=CSV_RULE_TEST_PHASE=read --dart-define="CSV_RULE_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-csv-rules-restart"
      - name: Test native calendar selection and explicit save preservation
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/date_picker_native_test.dart -d windows
      - name: Test native quick entry - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/entry_qol_restart_test.dart -d windows --dart-define=ENTRY_TEST_PHASE=write --dart-define="ENTRY_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-entry-restart"
      - name: Test native quick entry - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/entry_qol_restart_test.dart -d windows --dart-define=ENTRY_TEST_PHASE=read --dart-define="ENTRY_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-entry-restart"
      - name: Test native fictional bank sync - write in first app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/bank_sync_restart_test.dart -d windows --dart-define=BANK_TEST_PHASE=write --dart-define="BANK_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-bank-restart"
      - name: Test native fictional bank sync - reopen in second app process
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/bank_sync_restart_test.dart -d windows --dart-define=BANK_TEST_PHASE=read --dart-define="BANK_TEST_DIRECTORY=${{ runner.temp }}/Budgetism-bank-restart"
      - name: Test native server Sandbox preview isolation
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter test integration_test/server_sandbox_native_test.dart -d windows
      - name: Retain fictional Sandbox preview screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Budgetism-Sandbox-preview-UI
          path: |
            ${{ env.BUDGETISM_SOURCE }}/apps/client/build/sandbox-native-preview.png
            ${{ env.BUDGETISM_SOURCE }}/apps/client/build/sandbox-native-review.png
            ${{ env.BUDGETISM_SOURCE }}/apps/client/build/server-address-native.png
            ${{ env.BUDGETISM_SOURCE }}/apps/client/build/appearance-dark-native.png
            ${{ env.BUDGETISM_SOURCE }}/apps/client/build/appearance-light-native.png
            ${{ env.BUDGETISM_SOURCE }}/apps/client/build/review-batch-native.png
            ${{ env.BUDGETISM_SOURCE }}/apps/client/build/server-dashboard-native.png
            ${{ env.BUDGETISM_SOURCE }}/apps/client/build/server-dashboard-compact-native.png
          if-no-files-found: error
      - name: Build Flutter Windows app
        working-directory: ${{ env.BUDGETISM_SOURCE }}/apps/client
        run: flutter build windows --release --dart-define=APP_VERSION=0.1.0-dev.23
      - name: Package portable app with stable filename
        working-directory: ${{ env.BUDGETISM_SOURCE }}
        run: ./scripts/package_windows.ps1 -Version '0.1.0-dev.23'
      - name: Verify portable package and native dependencies
        working-directory: ${{ env.BUDGETISM_SOURCE }}
        run: python scripts/verify_windows_package.py build/packages/Budgetism-Windows-x64.zip --version 0.1.0-dev.23 --checksums build/packages/checksums.sha256 --self-test
      - name: Scan the exact Windows archive and extracted contents with Defender
        timeout-minutes: 10
        working-directory: ${{ env.BUDGETISM_SOURCE }}
        run: powershell -NoProfile -File ./scripts/scan_windows_package.ps1 -Archive build/packages/Budgetism-Windows-x64.zip -ReportDirectory build/security
      - name: Retain build security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Budgetism-Windows-security-evidence
          path: |
            ${{ env.BUDGETISM_SOURCE }}/build/security/*.json
            ${{ env.BUDGETISM_SOURCE }}/build/security/*.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Budgetism-Windows-x64-development
          path: |
            ${{ env.BUDGETISM_SOURCE }}/build/packages/Budgetism-Windows-x64.zip
            ${{ env.BUDGETISM_SOURCE }}/build/packages/checksums.sha256
          if-no-files-found: error

# CI retains development artifacts only. No source push, release or deployment.
